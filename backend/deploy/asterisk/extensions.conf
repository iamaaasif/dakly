; Dakly AI voice call. Dakly starts each call through ARI as Local/s@dakly-call with these variables:
;   DAKLY_TO   number to dial, digits only (already in the format the trunk wants)
;   DAKLY_MSG  campaign message id (the speech is fetched for it from Dakly)
;   DAKLY_SIG  signature Dakly checks on every callback
; Results go back to Dakly at ${DAKLY_URL}/api/webhooks/asterisk.

[dakly-call]
exten => s,1,NoOp(Dakly call ${DAKLY_MSG} to ${DAKLY_TO})
 same => n,Set(__DAKLY_MSG=${FILTER(a-z0-9,${DAKLY_MSG})})
 same => n,Set(__DAKLY_SIG=${FILTER(a-f0-9,${DAKLY_SIG})})
 same => n,Set(TO=${FILTER(0-9+,${DAKLY_TO})})
 same => n,GotoIf($["${TO}" = "" | "${DAKLY_MSG}" = ""]?bad)
 same => n,Set(CALLERID(all)=${CALLER_ID} <${CALLER_ID}>)
 same => n,Dial(PJSIP/${TO}@trunk,${RING_SECONDS},U(dakly-ivr^s^1))
 ; Only reached when nobody answered: BUSY, NOANSWER, CONGESTION, CHANUNAVAIL, CANCEL
 same => n,Set(R=${CURL(${DAKLY_URL}/api/webhooks/asterisk?m=${DAKLY_MSG}&sig=${DAKLY_SIG}&event=status&status=${DIALSTATUS}&cause=${HANGUPCAUSE})})
 same => n,Hangup()
 same => n(bad),Hangup(21)

; Runs on the customer's leg as soon as they answer: play the message, wait for one key.
[dakly-ivr]
exten => s,1,Set(BASE=${DAKLY_URL}/api/voice/audio/${DAKLY_MSG})
 same => n,Set(R=${CURL(${DAKLY_URL}/api/webhooks/asterisk?m=${DAKLY_MSG}&sig=${DAKLY_SIG}&event=answered)})
 same => n,Wait(0.5)
 same => n,Read(DIGIT,${BASE}/main.sln24,1,,1,${KEY_WAIT})
 same => n,Set(R=${CURL(${DAKLY_URL}/api/webhooks/asterisk?m=${DAKLY_MSG}&sig=${DAKLY_SIG}&event=digit&digit=${DIGIT})})
 same => n,GotoIf($["${DIGIT}" = "1"]?yes)
 same => n,Playback(${BASE}/bye.sln24)
 same => n,Set(GOSUB_RESULT=ABORT)
 same => n,Return()
 same => n(yes),Playback(${BASE}/thanks.sln24)
 same => n,Set(GOSUB_RESULT=ABORT)
 same => n,Return()

; The other half of the Local channel just waits until the call ends.
[dakly-hold]
exten => s,1,Wait(600)
 same => n,Hangup()

; The trunk sends nothing inbound to Dakly yet; refuse politely.
[dakly-inbound]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
